# Interface-to-NIC mapping for DU
# Values are injected via PackageVariant apply-setters
apiVersion: v1
kind: ConfigMap
metadata:
  name: interface-setters
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  networking-mode: "vlan" # kpt-set: ${networking-mode}
  f1-interface: "eno49" # kpt-set: ${f1-interface}
